<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Eagle PPF</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#050506" />
<!-- Cloudflare Pages: jab koi file nahi milti to ye page asli "404" status ke
     saath dikhta hai. Iske bina Cloudflare har galat URL par homepage (200 OK)
     de deta hai — isi wajah se Google ko /favicon.ico ki jagah HTML mila tha. -->
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0C0E;color:#C9CDD3;
       font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
  img{width:96px;height:auto;margin-bottom:22px}
  p.meta{font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;color:#E01A22;margin:0 auto 12px}
  h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.05;margin:0 0 14px;color:#fff;text-transform:uppercase;letter-spacing:.02em}
  p{margin:0 auto 28px;max-width:40ch}
  a.btn{display:inline-block;padding:14px 26px;background:#E01A22;color:#fff;text-decoration:none;
        font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.86rem}
</style>
</head>
<body>
  <main>
    <img src="/android-chrome-192x192.png" alt="Eagle PPF" />
    <p class="meta">404</p>
    <h1>That page does not exist.</h1>
    <p>The link may be out of date. Head back to the Eagle PPF home page.</p>
    <a class="btn" href="/">Back to home</a>
  </main>
</body>
</html>
